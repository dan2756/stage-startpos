name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          # Geode v5.11.2 (from mod.json), the CLI and bindings commit it was
          # built with, and codegen built from source: the prebuilt codegen is
          # always the newest and generates headers v5 doesn't have.
          cli: v3.9.0
          bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}/*.geode

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.build.outputs.build-output }}
        run: |
          version=$(jq -r .version mod.json)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match mod.json version $version" >&2
            exit 1
          fi
          # This version's section of changelog.md becomes the release notes
          awk -v v="## $version" '{sub(/\r$/, "")} $0 == v {on=1; next} /^## / {on=0} on' changelog.md > notes.md
          gh release create "$GITHUB_REF_NAME" "$OUTPUT"/*.geode \
            --title "Stage Startpos $GITHUB_REF_NAME" --notes-file notes.md
